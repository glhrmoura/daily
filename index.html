    <style>
      html,
      body {
        margin: 0;
        background-color: #1a191b;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        background-color: #1a191b;
        transition: opacity 180ms ease;
      }
      @media (max-width: 768px) {
        #app-splash {
          display: flex;
        }
      }
      #app-splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash img {
        width: 28vmin;
        height: 28vmin;
        object-fit: contain;
      }
      #app-skeleton {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #1a191b;
        transition: opacity 220ms ease;
      }
      @media (min-width: 769px) {
        #app-skeleton {
          display: block;
        }
      }
      #app-skeleton.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-skeleton .shell {
        max-width: 42rem;
        margin: 0 auto;
        padding: 1rem;
        padding-top: calc(5.5rem + env(safe-area-inset-top, 0px));
      }
      #app-skeleton .bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        border-bottom: 1px solid rgb(255 255 255 / 12%);
        background: rgb(26 25 27 / 95%);
        padding: 1rem;
      }
      #app-skeleton .bar-inner {
        max-width: 42rem;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      #app-skeleton .row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      #app-skeleton .col {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      #app-skeleton .gap {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        margin-top: 1.5rem;
      }
      #app-skeleton .bone {
        border-radius: 0.75rem;
        background: rgb(154 79 236 / 8%);
        animation: soft-pulse 1.8s ease-in-out infinite;
      }
      @keyframes soft-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.85;
        }
      }
    </style>

  <body>
    <div id="app-splash">
      <img src="/icons/icon-192x192.png" alt="" width="192" height="192" />
    </div>
    <div id="app-skeleton">
      <div class="bar">
        <div class="bar-inner">
          <div class="row">
            <div class="bone" style="width: 2.5rem; height: 2.5rem"></div>
            <div class="col">
              <div class="bone" style="width: 4rem; height: 1.1rem"></div>
              <div class="bone" style="width: 7rem; height: 0.7rem"></div>
            </div>
          </div>
          <div class="row">
            <div class="bone" style="width: 2.5rem; height: 2.5rem"></div>
            <div class="bone" style="width: 2.5rem; height: 2.5rem"></div>
          </div>
        </div>
      </div>
      <div class="shell">
        <div class="col" style="gap: 0.6rem">
          <div class="bone" style="width: 8rem; height: 0.7rem"></div>
          <div class="bone" style="width: 12rem; height: 1.4rem"></div>
          <div class="bone" style="width: 16rem; height: 0.85rem"></div>
        </div>
        <div class="gap">
          <div class="bone" style="width: 100%; height: 7rem; border-radius: 1rem"></div>
          <div class="bone" style="width: 100%; height: 7rem; border-radius: 1rem"></div>
          <div class="bone" style="width: 100%; height: 7rem; border-radius: 1rem"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script src="/ios-config.js"></script>
