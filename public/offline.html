<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily - Offline</title>
    <style>
      body {
        font-family: 'Lexend', sans-serif;
        background-color: #1a191b;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 400px;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 16px;
        overflow: hidden;
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      h1 {
        color: #9a4fec;
        margin-bottom: 10px;
      }
      p {
        color: #a39aaf;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img src="/logo.png" alt="Daily" />
      </div>
      <h1>Você está offline</h1>
      <p>Verifique sua conexão com a internet e tente novamente.</p>
    </div>
  </body>
</html>
